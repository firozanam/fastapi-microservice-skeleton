[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

 # Test paths
testpaths = tests/unit tests/integration

# Output options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=100
    --asyncio-mode=auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication tests
    db: Database tests
    postgres: Tests requiring PostgreSQL (ENABLE_POSTGRES=true)
    mongodb: Tests requiring MongoDB (ENABLE_MONGODB=true)
    redis: Tests requiring Redis (ENABLE_REDIS=true)

# Coverage settings
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */env/*
    */ENV/*
    */.venv/*
    */virtualenv/*
    */.virtualenv/*
    */.pytest_cache/*
    */.tox/*
    */.eggs/*
    */build/*
    */dist/*
    */*.egg-info/*
    */.git/*
    */.idea/*
    */.vscode/*
    */.DS_Store*
    */Thumbs.db*
    */htmlcov/*
    */.coverage.xml*
    */.pytest_cache/*
    */.mypy_cache/*
    */.ruff_cache/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 100
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
